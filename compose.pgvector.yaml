services:
  liteclaw:
    environment:
      LITECLAW_PGVECTOR_URL: postgresql://liteclaw:${LITECLAW_POSTGRES_PASSWORD:?Set LITECLAW_POSTGRES_PASSWORD}@postgres:5432/liteclaw
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: liteclaw
      POSTGRES_PASSWORD: ${LITECLAW_POSTGRES_PASSWORD:?Set LITECLAW_POSTGRES_PASSWORD}
      POSTGRES_DB: liteclaw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liteclaw -d liteclaw"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
